<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Devesh Sharma — Full Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0D2A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <circle cx="1040" cy="70" r="200" fill="#38BDF8" opacity="0.07"/>
  <circle cx="1130" cy="260" r="140" fill="#A78BFA" opacity="0.08"/>

  <rect x="72" y="96" width="4" height="128" rx="2" fill="url(#accent)"/>

  <text x="104" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#5EEAD4" letter-spacing="4">FULL STACK DEVELOPER</text>

  <text x="104" y="196" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="700" fill="#F1F5F9">Devesh Sharma</text>

  <text x="104" y="234" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" fill="#94A3B8">Python · Django · FastAPI · Angular 22 · PostgreSQL</text>

  <rect x="104" y="258" width="360" height="2" fill="url(#fade)"/>

  <text x="104" y="290" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#64748B">I build and ship complete web applications — three live in production.</text>

  <g transform="translate(830,150)" font-family="'Cascadia Code','Consolas',monospace" font-size="15">
    <rect x="-24" y="-64" width="300" height="152" rx="10" fill="#0F172A" opacity="0.72" stroke="#1E293B"/>
    <circle cx="-4" cy="-44" r="5" fill="#F87171"/>
    <circle cx="14" cy="-44" r="5" fill="#FBBF24"/>
    <circle cx="32" cy="-44" r="5" fill="#34D399"/>
    <text x="-4" y="-12" fill="#64748B">$ git commit -m</text>
    <text x="-4" y="14" fill="#5EEAD4">  "ship it"</text>
    <text x="-4" y="46" fill="#64748B">$ <tspan fill="#A78BFA">deployed</tspan> ✓</text>
